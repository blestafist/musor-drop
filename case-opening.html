<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Opening - Подписки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #667eea;
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
        }

        .balance {
            font-size: 32px;
            font-weight: bold;
            color: #4CAF50;
        }

        .balance-label {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .cases-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .case-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 2px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .case-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .case-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .case-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .case-price {
            font-size: 20px;
            color: #FFD700;
            margin-bottom: 20px;
        }

        .open-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            margin: 5px;
        }

        .open-btn:hover {
            transform: scale(1.05);
        }

        .open-btn:active {
            transform: scale(0.95);
        }

        .open-btn-x20 {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            margin: 5px;
            width: calc(100% - 10px);
        }

        .open-btn-x20:hover {
            transform: scale(1.05);
        }

        .open-btn-x20:active {
            transform: scale(0.95);
        }

        .slider-container {
            width: 100%;
            margin: 10px 0;
        }

        .amount-slider {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            -webkit-appearance: none;
        }

        .amount-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            cursor: pointer;
        }

        .amount-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            cursor: pointer;
            border: none;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .amount-display {
            font-size: 18px;
            font-weight: bold;
            color: #FFD700;
            text-align: center;
            margin: 10px 0;
        }

        .drop-rates-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 15px;
            color: #aaa;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .drop-rates-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 20px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .modal-header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .drop-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            border-radius: 10px;
            justify-content: space-between;
        }

        .drop-item-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .drop-chance {
            font-weight: bold;
            padding: 5px 15px;
            border-radius: 15px;
            background: rgba(255, 215, 0, 0.2);
            color: #FFD700;
        }

        .collection-view {
            display: none;
        }

        .collection-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: #aaa;
        }

        .collection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .collection-item {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .collection-count {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 5px 10px;
            border-radius: 15px;
            font-weight: bold;
            color: #FFD700;
        }

        .bulk-progress {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .progress-bar {
            width: 80%;
            max-width: 600px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .bulk-results {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 20px;
            z-index: 2000;
            max-width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .result-mini-item {
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }

        .opening-animation {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .animation-container {
            width: 90%;
            max-width: 1200px;
            overflow: hidden;
            position: relative;
            height: 200px;
            border: 3px solid #FFD700;
            border-radius: 10px;
        }

        .items-roll {
            display: flex;
            position: absolute;
            transition: transform 4s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .roll-item {
            min-width: 180px;
            height: 180px;
            margin: 10px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            padding: 10px;
            text-align: center;
        }

        .selector {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 3px;
            height: 220px;
            background: #FFD700;
            z-index: 10;
            box-shadow: 0 0 20px #FFD700;
        }

        .inventory {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
        }

        .inventory-title {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .inventory-item {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            position: relative;
        }

        .item-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .item-price {
            color: #4CAF50;
            margin-bottom: 10px;
        }

        .sell-btn {
            background: #4CAF50;
            border: none;
            padding: 8px 20px;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .sell-btn:hover {
            background: #45a049;
        }

        /* Rarity colors */
        .common {
            background: linear-gradient(135deg, #b0b0b0 0%, #808080 100%);
            border: 2px solid #808080;
        }

        .uncommon {
            background: linear-gradient(135deg, #5cb85c 0%, #449d44 100%);
            border: 2px solid #449d44;
        }

        .rare {
            background: linear-gradient(135deg, #5bc0de 0%, #31b0d5 100%);
            border: 2px solid #31b0d5;
        }

        .epic {
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
            border: 2px solid #8e44ad;
        }

        .legendary {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            border: 2px solid #e67e22;
        }

        .mythic {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            border: 2px solid #c0392b;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.5);
        }

        .divine {
            background: linear-gradient(135deg, #00ffff 0%, #0080ff 50%, #ff00ff 100%);
            border: 3px solid #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.8), 0 0 50px rgba(255, 0, 255, 0.5);
            animation: divine-glow 2s ease-in-out infinite;
        }

        @keyframes divine-glow {
            0%, 100% {
                box-shadow: 0 0 30px rgba(0, 255, 255, 0.8), 0 0 50px rgba(255, 0, 255, 0.5);
            }
            50% {
                box-shadow: 0 0 40px rgba(0, 255, 255, 1), 0 0 70px rgba(255, 0, 255, 0.8);
            }
        }

        .service-logo {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            padding: 15px;
        }

        .service-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        .service-logo-small {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            padding: 12px;
        }

        .service-logo-small img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        .service-logo-large {
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            padding: 20px;
        }

        .service-logo-large img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        .result-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 20px;
            display: none;
            z-index: 2000;
            text-align: center;
            min-width: 300px;
        }

        .result-item {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .close-btn {
            background: #667eea;
            border: none;
            padding: 10px 30px;
            border-radius: 25px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <div class="balance-label">Ваш баланс</div>
            <div class="balance">$<span id="balance">999999</span></div>
        </div>
        <div class="nav-buttons">
            <button class="nav-btn active" onclick="showView('cases')">Кейсы</button>
            <button class="nav-btn" onclick="showView('inventory')">Инвентарь</button>
            <button class="nav-btn" onclick="showView('collection')">Коллекция</button>
        </div>
    </div>

    <div id="casesView">
        <div class="cases-container" id="cases"></div>
    </div>

    <div id="inventoryView" style="display: none;">
        <div class="inventory">
            <h2 class="inventory-title">Ваш инвентарь</h2>
            <div class="inventory-grid" id="inventory"></div>
        </div>
    </div>

    <div id="collectionView" class="collection-view">
        <h2 style="text-align: center; margin-bottom: 30px; font-size: 32px;">Коллекция</h2>
        <div class="collection-stats">
            <div class="stat-card">
                <div class="stat-value" id="totalOpened">0</div>
                <div class="stat-label">Всего открыто</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="uniqueItems">0</div>
                <div class="stat-label">Уникальных предметов</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalSpent">$0</div>
                <div class="stat-label">Потрачено</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalEarned">$0</div>
                <div class="stat-label">Получено ценности</div>
            </div>
        </div>
        <h3 style="margin-bottom: 20px;">Все выпавшие предметы</h3>
        <div class="collection-grid" id="collectionGrid"></div>
    </div>

    <div class="bulk-progress" id="bulkProgress">
        <h2 style="margin-bottom: 20px;">Открываем кейсы...</h2>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill">0/20</div>
        </div>
        <div id="progressText" style="font-size: 18px; color: #aaa;">Подготовка...</div>
    </div>

    <div class="opening-animation" id="openingAnimation">
        <div class="animation-container">
            <div class="selector"></div>
            <div class="items-roll" id="itemsRoll"></div>
        </div>
    </div>

    <div class="result-display" id="resultDisplay">
        <div class="result-item" id="resultItem"></div>
        <button class="close-btn" onclick="closeResult()">Забрать</button>
    </div>

    <div class="bulk-results" id="bulkResults">
        <h2 style="margin-bottom: 20px; text-align: center;">Результаты открытия</h2>
        <div class="results-grid" id="resultsGrid"></div>
        <div style="text-align: center; margin-top: 20px;">
            <div id="totalValue" style="font-size: 24px; color: #4CAF50; margin-bottom: 20px;"></div>
            <button class="close-btn" onclick="closeBulkResults()">Забрать всё</button>
        </div>
    </div>

    <div class="modal" id="dropRatesModal">
        <div class="modal-content">
            <div class="modal-header">Шансы выпадения</div>
            <div id="dropRatesList"></div>
            <button class="close-btn" onclick="closeDropRates()" style="width: 100%; margin-top: 20px;">Закрыть</button>
        </div>
    </div>

    <script>
        let balance = localStorage.getItem('balance') ? parseInt(localStorage.getItem('balance')) : 999999;
        let inventory = localStorage.getItem('inventory') ? JSON.parse(localStorage.getItem('inventory')) : [];
        let collection = localStorage.getItem('collection') ? JSON.parse(localStorage.getItem('collection')) : {};
        let stats = localStorage.getItem('stats') ? JSON.parse(localStorage.getItem('stats')) : {
            totalOpened: 0,
            totalSpent: 0,
            totalEarned: 0
        };

        function saveData() {
            localStorage.setItem('balance', balance);
            localStorage.setItem('inventory', JSON.stringify(inventory));
            localStorage.setItem('collection', JSON.stringify(collection));
            localStorage.setItem('stats', JSON.stringify(stats));
        }

        const subscriptions = {
            netflix: { name: 'Netflix Premium', color: '#E50914', svg: 'netflix' },
            spotify: { name: 'Spotify Premium', color: '#1DB954', svg: 'spotify' },
            youtube: { name: 'YouTube Premium', color: '#FF0000', svg: 'youtube' },
            disney: { name: 'Disney+', color: '#113CCF', svg: 'disneyplus' },
            hbo: { name: 'HBO Max', color: '#9D34DA', svg: 'hbo' },
            apple: { name: 'Apple Music', color: '#FA243C', svg: 'applemusic' },
            amazon: { name: 'Amazon Prime', color: '#00A8E1', svg: 'amazon' },
            twitch: { name: 'Twitch Turbo', color: '#9146FF', svg: 'twitch' },
            chatgpt: { name: 'ChatGPT Plus', color: '#10A37F', svg: 'openai' },
            github: { name: 'GitHub Pro', color: '#181717', svg: 'github' },
            dropbox: { name: 'Dropbox Plus', color: '#0061FF', svg: 'dropbox' },
            nordvpn: { name: 'NordVPN', color: '#4687FF', svg: 'nordvpn' },
            midjourney: { name: 'Midjourney Pro', color: '#000000', svg: 'midjourney' },
            claude: { name: 'Claude Pro', color: '#CC9B7A', svg: 'anthropic' },
            copilot: { name: 'GitHub Copilot', color: '#000000', svg: 'githubcopilot' },
            runway: { name: 'Runway ML', color: '#0066FF', svg: 'runway' },
            jasper: { name: 'Jasper AI', color: '#8B5CF6', svg: 'jasper' },
            dalle: { name: 'DALL-E 3', color: '#10A37F', svg: 'openai' },
            perplexity: { name: 'Perplexity Pro', color: '#1FB6FF', svg: 'perplexity' },
            mistral: { name: 'Mistral AI', color: '#FF6B35', svg: 'mistral' },
            grok: { name: 'Grok AI', color: '#000000', svg: 'x' },
            gemini: { name: 'Gemini Advanced', color: '#4285F4', svg: 'googlegemini' },
            cursor: { name: 'Cursor Pro', color: '#000000', svg: 'cursor' },
            replit: { name: 'Replit AI', color: '#F26207', svg: 'replit' },
            v0: { name: 'v0 by Vercel', color: '#000000', svg: 'vercel' },
            poe: { name: 'Poe Premium', color: '#FF4B4B', svg: 'poe' }
        };

        const cases = [
            {
                id: 1,
                name: 'Стартовый кейс',
                price: 100,
                image: 'https://image.pollinations.ai/prompt/silver%20metallic%20mystery%20box%20with%20white%20glowing%20lights%203D%20render%20dark%20background%20realistic?width=400&height=300&nologo=true&seed=101',
                items: [
                    { service: 'spotify', rarity: 'common', price: 50, chance: 40 },
                    { service: 'youtube', rarity: 'common', price: 60, chance: 30 },
                    { service: 'apple', rarity: 'uncommon', price: 150, chance: 20 },
                    { service: 'netflix', rarity: 'rare', price: 300, chance: 10 }
                ]
            },
            {
                id: 2,
                name: 'Развлекательный кейс',
                price: 500,
                image: 'https://image.pollinations.ai/prompt/entertainment%20case%20box%2C%20vibrant%20purple%20and%20pink%20neon%20lights%2C%20cinema%20theme%2C%203D%20render%2C%20dark%20background?width=400&height=300&nologo=true',
                items: [
                    { service: 'youtube', rarity: 'uncommon', price: 200, chance: 35 },
                    { service: 'netflix', rarity: 'rare', price: 600, chance: 25 },
                    { service: 'disney', rarity: 'rare', price: 700, chance: 20 },
                    { service: 'hbo', rarity: 'epic', price: 1200, chance: 15 },
                    { service: 'twitch', rarity: 'legendary', price: 2500, chance: 5 }
                ]
            },
            {
                id: 3,
                name: 'Премиум кейс',
                price: 1500,
                image: 'https://image.pollinations.ai/prompt/premium%20luxury%20case%20box%2C%20gold%20metallic%2C%20glowing%20orange%20energy%2C%20elegant%20design%2C%203D%20render%2C%20dark%20background?width=400&height=300&nologo=true',
                items: [
                    { service: 'netflix', rarity: 'rare', price: 1000, chance: 30 },
                    { service: 'disney', rarity: 'epic', price: 2000, chance: 25 },
                    { service: 'amazon', rarity: 'epic', price: 2500, chance: 20 },
                    { service: 'chatgpt', rarity: 'legendary', price: 5000, chance: 15 },
                    { service: 'github', rarity: 'legendary', price: 6000, chance: 8 },

                    { service: 'dropbox', rarity: 'mythic', price: 20000, chance: 1 }
                ]
            },
            {

                price: 15000,
                image: 'https://api.dicebear.com/9.x/shapes/svg?seed=ai-tech&backgroundColor=06b6d4,0891b2,0e7490&scale=120',
                items: [
                    { service: 'chatgpt', rarity: 'legendary', price: 10000, chance: 20 },
                    { service: 'copilot', rarity: 'legendary', price: 12000, chance: 18 },

                ]
            },
            {

                price: 20000,
                image: 'https://api.dicebear.com/9.x/shapes/svg?seed=developer&backgroundColor=16a34a,15803d,166534&scale=120',
                items: [
                    { service: 'copilot', rarity: 'legendary', price: 15000, chance: 25 },
                    { service: 'cursor', rarity: 'mythic', price: 35000, chance: 20 },
                    { service: 'replit', rarity: 'mythic', price: 32000, chance: 18 },
                    { service: 'v0', rarity: 'mythic', price: 38000, chance: 15 },
                    { service: 'claude', rarity: 'mythic', price: 40000, chance: 12 },
                    { service: 'chatgpt', rarity: 'divine', price: 70000, chance: 7 },
                    { service: 'poe', rarity: 'divine', price: 85000, chance: 3 }
                ]
            }
        ];

        function renderCases() {
            const casesContainer = document.getElementById('cases');
            casesContainer.innerHTML = cases.map(caseItem => `
                <div class="case-card">
                    <img src="${caseItem.image}" class="case-image" alt="${caseItem.name}">
                    <div class="case-name">${caseItem.name}</div>
                    <div class="case-price">$${caseItem.price}</div>
                    <button class="open-btn" onclick="openCase(${caseItem.id})">Открыть x1</button>
                    <div class="slider-container">
                        <div class="slider-label">
                            <span>Массовое открытие</span>
                        </div>
                        <input type="range" min="1" max="30" value="10" class="amount-slider" id="slider-${caseItem.id}" oninput="updateSlider(${caseItem.id})">
                        <div class="amount-display" id="display-${caseItem.id}">x10 = $${(caseItem.price * 10).toLocaleString()}</div>
                        <button class="open-btn-x20" onclick="openBulkCase(${caseItem.id})">Открыть</button>
                    </div>
                    <button class="drop-rates-btn" onclick="showDropRates(${caseItem.id})">📊 Шансы дропа</button>
                </div>
            `).join('');
        }

        function getRandomItem(items) {
            const totalChance = items.reduce((sum, item) => sum + item.chance, 0);
            let random = Math.random() * totalChance;
            
            for (let item of items) {
                random -= item.chance;
                if (random <= 0) {
                    return item;
                }
            }
            return items[0];
        }

        function openCase(caseId) {
            const caseData = cases.find(c => c.id === caseId);
            
            if (balance < caseData.price) {
                alert('Недостаточно средств!');
                return;
            }

            balance -= caseData.price;
            updateBalance();
            stats.totalOpened += 1;
            stats.totalSpent += caseData.price;
            saveData();

            const wonItem = getRandomItem(caseData.items);
            
            // Create roll animation
            const roll = document.getElementById('itemsRoll');
            roll.innerHTML = '';
            roll.style.transform = 'translateX(0)';

            const items = [];
            for (let i = 0; i < 50; i++) {
                const randomItem = caseData.items[Math.floor(Math.random() * caseData.items.length)];
                items.push(randomItem);
            }
            
            // Place won item near the end
            items[45] = wonItem;

            items.forEach(item => {
                const sub = subscriptions[item.service];
                const div = document.createElement('div');
                div.className = `roll-item ${item.rarity}`;
                div.innerHTML = `
                    <div class="service-logo" style="background: ${sub.color}; margin: 0 auto;">
                        <img src="https://cdn.simpleicons.org/${sub.svg}/white" alt="${sub.name}">
                    </div>
                    <div style="font-size: 12px; margin-top: 10px;">${sub.name}</div>
                    <div style="font-size: 14px; color: #FFD700;">$${item.price}</div>
                `;
                roll.appendChild(div);
            });

            const animation = document.getElementById('openingAnimation');
            animation.style.display = 'flex';

            setTimeout(() => {
                const offset = -(45 * 200 - window.innerWidth / 2 + 100);
                roll.style.transform = `translateX(${offset}px)`;
            }, 100);

            setTimeout(() => {
                animation.style.display = 'none';
                showResult(wonItem);
                inventory.push(wonItem);
                addToCollection(wonItem);
                stats.totalEarned += wonItem.price;
                saveData();
                renderInventory();
            }, 4500);
        }

        function showResult(item) {
            const sub = subscriptions[item.service];
            const resultDisplay = document.getElementById('resultDisplay');
            const resultItem = document.getElementById('resultItem');
            
            resultItem.innerHTML = `
                <div class="roll-item ${item.rarity}" style="display: inline-block; margin-bottom: 20px;">
                    <div class="service-logo-large" style="background: ${sub.color}; margin: 0 auto;">
                        <img src="https://cdn.simpleicons.org/${sub.svg}/white" alt="${sub.name}">
                    </div>
                    <div style="font-size: 18px; margin-top: 10px;">${sub.name}</div>
                    <div style="font-size: 20px; color: #FFD700;">$${item.price}</div>
                </div>
            `;
            
            resultDisplay.style.display = 'block';
        }

        function closeResult() {
            document.getElementById('resultDisplay').style.display = 'none';
        }

        function updateSlider(caseId) {
            const caseData = cases.find(c => c.id === caseId);
            const slider = document.getElementById(`slider-${caseId}`);
            const display = document.getElementById(`display-${caseId}`);
            const amount = parseInt(slider.value);
            const totalCost = caseData.price * amount;
            display.textContent = `x${amount} = $${totalCost.toLocaleString()}`;
        }

        function openBulkCase(caseId) {
            const caseData = cases.find(c => c.id === caseId);
            const slider = document.getElementById(`slider-${caseId}`);
            const amount = parseInt(slider.value);
            const totalCost = caseData.price * amount;
            
            if (balance < totalCost) {
                alert('Недостаточно средств! Нужно: $' + totalCost.toLocaleString());
                return;
            }

            balance -= totalCost;
            updateBalance();
            stats.totalOpened += amount;
            stats.totalSpent += totalCost;
            saveData();

            const bulkProgress = document.getElementById('bulkProgress');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            
            bulkProgress.style.display = 'flex';

            const wonItems = [];
            let opened = 0;

            const openNext = () => {
                if (opened < amount) {
                    const wonItem = getRandomItem(caseData.items);
                    wonItems.push(wonItem);
                    opened++;

                    progressFill.style.width = (opened / amount * 100) + '%';
                    progressFill.textContent = opened + '/' + amount;
                    progressText.textContent = `Открыто ${opened} из ${amount} кейсов...`;

                    setTimeout(openNext, 200);
                } else {
                    bulkProgress.style.display = 'none';
                    showBulkResults(wonItems);
                    wonItems.forEach(item => {
                        inventory.push(item);
                        addToCollection(item);
                        stats.totalEarned += item.price;
                    });
                    saveData();
                    renderInventory();
                }
            };

            setTimeout(openNext, 300);
        }

        function showBulkResults(items) {
            const bulkResults = document.getElementById('bulkResults');
            const resultsGrid = document.getElementById('resultsGrid');
            const totalValue = document.getElementById('totalValue');

            let total = 0;
            resultsGrid.innerHTML = items.map(item => {
                const sub = subscriptions[item.service];
                total += item.price;
                return `
                    <div class="result-mini-item ${item.rarity}">
                        <div class="service-logo-small" style="background: ${sub.color}; margin: 0 auto 5px;">
                            <img src="https://cdn.simpleicons.org/${sub.svg}/white" alt="${sub.name}">
                        </div>
                        <div style="font-size: 11px; margin-bottom: 3px;">${sub.name}</div>
                        <div style="font-size: 12px; color: #FFD700;">$${item.price.toLocaleString()}</div>
                    </div>
                `;
            }).join('');

            totalValue.textContent = `Общая стоимость: $${total.toLocaleString()}`;
            bulkResults.style.display = 'block';
        }

        function closeBulkResults() {
            document.getElementById('bulkResults').style.display = 'none';
        }

        function sellItem(index) {
            const item = inventory[index];
            balance += item.price;
            updateBalance();
            inventory.splice(index, 1);
            saveData();
            renderInventory();
        }

        function renderInventory() {
            const inventoryGrid = document.getElementById('inventory');
            inventoryGrid.innerHTML = inventory.map((item, index) => {
                const sub = subscriptions[item.service];
                return `
                    <div class="inventory-item ${item.rarity}">
                        <div class="service-logo-small" style="background: ${sub.color}; margin: 0 auto 10px;">
                            <img src="https://cdn.simpleicons.org/${sub.svg}/white" alt="${sub.name}">
                        </div>
                        <div class="item-name">${sub.name}</div>
                        <div class="item-price">$${item.price}</div>
                        <button class="sell-btn" onclick="sellItem(${index})">Продать</button>
                    </div>
                `;
            }).join('');
        }

        function updateBalance() {
            document.getElementById('balance').textContent = balance.toLocaleString();
        }

        function showView(view) {
            // Hide all views
            document.getElementById('casesView').style.display = 'none';
            document.getElementById('inventoryView').style.display = 'none';
            document.getElementById('collectionView').style.display = 'none';

            // Update nav buttons
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

            // Show selected view
            if (view === 'cases') {
                document.getElementById('casesView').style.display = 'block';
                document.querySelectorAll('.nav-btn')[0].classList.add('active');
            } else if (view === 'inventory') {
                document.getElementById('inventoryView').style.display = 'block';
                document.querySelectorAll('.nav-btn')[1].classList.add('active');
            } else if (view === 'collection') {
                document.getElementById('collectionView').style.display = 'block';
                document.querySelectorAll('.nav-btn')[2].classList.add('active');
                renderCollection();
            }
        }

        function addToCollection(item) {
            const key = `${item.service}_${item.rarity}`;
            if (!collection[key]) {
                collection[key] = {
                    service: item.service,
                    rarity: item.rarity,
                    price: item.price,
                    count: 0
                };
            }
            collection[key].count += 1;
        }

        function renderCollection() {
            const totalOpened = document.getElementById('totalOpened');
            const uniqueItems = document.getElementById('uniqueItems');
            const totalSpent = document.getElementById('totalSpent');
            const totalEarned = document.getElementById('totalEarned');

            totalOpened.textContent = stats.totalOpened;
            uniqueItems.textContent = Object.keys(collection).length;
            totalSpent.textContent = '$' + stats.totalSpent.toLocaleString();
            totalEarned.textContent = '$' + stats.totalEarned.toLocaleString();

            const collectionGrid = document.getElementById('collectionGrid');
            const collectionArray = Object.values(collection).sort((a, b) => b.count - a.count);

            collectionGrid.innerHTML = collectionArray.map(item => {
                const sub = subscriptions[item.service];
                return `
                    <div class="collection-item ${item.rarity}" style="position: relative;">
                        <div class="collection-count">x${item.count}</div>
                        <div class="service-logo-small" style="background: ${sub.color}; margin: 0 auto 10px;">
                            <img src="https://cdn.simpleicons.org/${sub.svg}/white" alt="${sub.name}">
                        </div>
                        <div class="item-name">${sub.name}</div>
                        <div class="item-price">$${item.price.toLocaleString()}</div>
                    </div>
                `;
            }).join('');
        }

        function showDropRates(caseId) {
            const caseData = cases.find(c => c.id === caseId);
            const modal = document.getElementById('dropRatesModal');
            const dropRatesList = document.getElementById('dropRatesList');

            const totalChance = caseData.items.reduce((sum, item) => sum + item.chance, 0);

            dropRatesList.innerHTML = `
                <div style="text-align: center; margin-bottom: 20px; font-size: 20px; font-weight: bold;">${caseData.name}</div>
                ${caseData.items.map(item => {
                    const sub = subscriptions[item.service];
                    const percentage = ((item.chance / totalChance) * 100).toFixed(2);
                    return `
                        <div class="drop-item ${item.rarity}">
                            <div class="drop-item-info">
                                <div class="service-logo-small" style="background: ${sub.color};">
                                    <img src="https://cdn.simpleicons.org/${sub.svg}/white" alt="${sub.name}">
                                </div>
                                <div>
                                    <div style="font-weight: bold;">${sub.name}</div>
                                    <div style="color: #FFD700; font-size: 14px;">$${item.price.toLocaleString()}</div>
                                </div>
                            </div>
                            <div class="drop-chance">${percentage}%</div>
                        </div>
                    `;
                }).join('')}
            `;

            modal.style.display = 'flex';
        }

        function closeDropRates() {
            document.getElementById('dropRatesModal').style.display = 'none';
        }

        renderCases();
        renderInventory();
    </script>
</body>
